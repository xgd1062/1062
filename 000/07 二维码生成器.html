<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>极简二维码生成器 Pro - 2026 版</title>
    <script src="https://cdn.bootcdn.net/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root {
            --primary: #667eea;
            --secondary: #764ba2;
            --accent: #00f2fe;
            --bg: #f0f2f5;
            --danger: #e53e3e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            width: 100%;
            max-width: 480px;
            border-radius: 28px;
            padding: 35px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.2);
        }

        h1 {
            text-align: center;
            font-size: 24px;
            color: #1a202c;
            margin-bottom: 30px;
            letter-spacing: 1px;
        }

        h1 span {
            color: var(--primary);
        }

        .section-label {
            font-size: 13px;
            font-weight: 700;
            color: #a0aec0;
            text-transform: uppercase;
            margin-bottom: 8px;
            display: block;
        }

        textarea {
            width: 100%;
            height: 110px;
            padding: 15px;
            border: 2px solid #e2e8f0;
            border-radius: 16px;
            background: #f7fafc;
            font-size: 16px;
            resize: none;
            outline: none;
            transition: all 0.3s ease;
            margin-bottom: 8px;
        }

        textarea:focus {
            border-color: var(--primary);
            background: white;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.15);
        }

        textarea.over {
            border-color: #fc8181;
            background: #fff5f5;
        }

        textarea.over:focus {
            border-color: var(--danger);
            box-shadow: 0 0 0 4px rgba(229, 62, 62, 0.15);
        }

        .input-meta {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: #a0aec0;
            margin-bottom: 16px;
            transition: color 0.25s ease;
        }

        .input-meta.over {
            color: var(--danger);
            font-weight: 700;
        }

        .input-meta .hint {
            color: #cbd5e0;
            font-weight: 400;
        }

        .input-meta.over .hint {
            color: #feb2b2;
            font-weight: 400;
        }

        .config-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 25px;
        }

        .config-item {
            background: #f7fafc;
            padding: 10px 15px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        input[type="color"] {
            border: none;
            width: 30px;
            height: 30px;
            cursor: pointer;
            background: none;
        }

        .qr-display-area {
            position: relative;
            background: #edf2f7;
            border-radius: 20px;
            width: 100%;
            height: 280px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 2px dashed #cbd5e0;
        }

        .qr-display-area.active {
            background: white;
            border: 2px solid #edf2f7;
        }

        .qr-display-area.error {
            background: #fff5f5;
            border: 2px dashed #fc8181;
        }

        .scanner-line {
            display: none;
            position: absolute;
            width: 240px;
            height: 3px;
            background: linear-gradient(to right, transparent, var(--accent), transparent);
            box-shadow: 0 0 15px var(--accent);
            z-index: 10;
            animation: scan 2s linear infinite;
        }

        @keyframes scan {
            0% {
                top: 20px;
            }

            50% {
                top: 260px;
            }

            100% {
                top: 20px;
            }
        }

        .placeholder {
            text-align: center;
            color: #a0aec0;
            transition: 0.3s;
            padding: 0 24px;
        }

        .placeholder-icon {
            font-size: 48px;
            margin-bottom: 10px;
            display: block;
        }

        .placeholder p {
            font-size: 14px;
            line-height: 1.7;
        }

        .placeholder.warn {
            color: var(--danger);
        }

        .placeholder.warn .placeholder-icon {
            animation: shake 0.4s ease;
        }

        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-4px);
            }

            75% {
                transform: translateX(4px);
            }
        }

        .placeholder .big-num {
            font-size: 17px;
            font-weight: 700;
        }

        .action-btns {
            margin-top: 20px;
            display: flex;
            gap: 12px;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border-radius: 12px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-download {
            background: var(--primary);
            color: white;
            display: none;
        }

        .btn-clear {
            background: #e2e8f0;
            color: #4a5568;
        }

        .btn:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        #qrcode img {
            padding: 10px;
            background: white;
            border-radius: 8px;
        }
    </style>
</head>

<body>

    <div class="card">
        <h1>QR Code <span>Gen Pro</span></h1>

        <label class="section-label">内容 / 链接</label>
        <textarea id="inputField" placeholder="输入网址、文本或 Wi-Fi 信息..."></textarea>

        <div class="input-meta" id="inputMeta">
            <span>已用 <b id="charCount">0</b> / <b id="charLimit">1273</b> 字符</span>
            <span class="hint">（中文按 3 字符计）</span>
        </div>

        <div class="config-row">
            <div class="config-item">
                <span style="font-size: 13px;">前景色</span>
                <input type="color" id="fgColor" value="#000000">
            </div>
            <div class="config-item">
                <span style="font-size: 13px;">背景色</span>
                <input type="color" id="bgColor" value="#ffffff">
            </div>
        </div>

        <div id="wrapper" class="qr-display-area">
            <div class="scanner-line" id="scanner"></div>
            <div id="qrcode"></div>
            <div class="placeholder" id="placeholderUI">
                <span class="placeholder-icon">📷</span>
                <p>等待输入内容</p>
            </div>
        </div>

        <div class="action-btns">
            <button class="btn btn-clear" onclick="clearContent()">清空</button>
            <button class="btn btn-download" id="dlBtn" onclick="downloadImage()">保存图片</button>
        </div>
    </div>

    <script>
        /* ---------- 元素引用（只获取一次，绝不再替换它们的父元素） ---------- */
        const input = document.getElementById('inputField');
        const container = document.getElementById('qrcode');
        const wrapper = document.getElementById('wrapper');
        const placeholder = document.getElementById('placeholderUI');
        const scanner = document.getElementById('scanner');
        const dlBtn = document.getElementById('dlBtn');
        const inputMeta = document.getElementById('inputMeta');
        const charCountEl = document.getElementById('charCount');
        const charLimitEl = document.getElementById('charLimit');

        /* ---------- 容量配置 ---------- */
        const MAX_BYTES_BY_LEVEL = { L: 2953, M: 2331, Q: 1663, H: 1273 };
        const ECC_NAME = 'H';
        const MAX_BYTES = MAX_BYTES_BY_LEVEL[ECC_NAME];

        // 若 QRCode 库加载失败则使用默认值 2（H 级），避免脚本直接崩溃
        const ECC_LEVEL =
            (typeof QRCode !== 'undefined' && QRCode.CorrectLevel)
                ? QRCode.CorrectLevel[ECC_NAME]
                : 2;

        // 初始化上限显示
        charLimitEl.textContent = MAX_BYTES;

        /* ---------- 工具函数 ---------- */
        function getByteLength(str) {
            let bytes = 0;
            for (const ch of str) {
                const code = ch.codePointAt(0);
                if (code <= 0x7F) bytes += 1;
                else if (code <= 0x7FF) bytes += 2;
                else if (code <= 0xFFFF) bytes += 3;
                else bytes += 4;
            }
            return bytes;
        }

        function debounce(fn, delay) {
            let timer;
            return function () {
                clearTimeout(timer);
                timer = setTimeout(() => fn.apply(this, arguments), delay);
            };
        }

        function showPlaceholder(icon, html, isWarn = false) {
            placeholder.style.display = 'block';
            placeholder.classList.toggle('warn', isWarn);
            placeholder.innerHTML =
                `<span class="placeholder-icon">${icon}</span><p>${html}</p>`;
        }

        /* ---------- 关键修复：直接改 textContent，绝不替换 innerHTML ---------- */
        function updateCounter() {
            const used = getByteLength(input.value.trim());
            charCountEl.textContent = used;
            charLimitEl.textContent = MAX_BYTES;

            const over = used > MAX_BYTES;
            inputMeta.classList.toggle('over', over);
            input.classList.toggle('over', over);

            return { used, over };
        }

        /* ---------- 生成二维码 ---------- */
        function updateQR() {
            const content = input.value.trim();
            const fg = document.getElementById('fgColor').value;
            const bg = document.getElementById('bgColor').value;

            const used = getByteLength(content);
            const over = used > MAX_BYTES;

            // 同步计数显示
            charCountEl.textContent = used;
            charLimitEl.textContent = MAX_BYTES;
            inputMeta.classList.toggle('over', over);
            input.classList.toggle('over', over);

            container.innerHTML = "";

            /* ---- 空状态 ---- */
            if (!content) {
                wrapper.classList.remove('active', 'error');
                scanner.style.display = 'none';
                dlBtn.style.display = 'none';
                showPlaceholder('📷', '等待输入内容');
                return;
            }

            /* ---- 超限状态 ---- */
            if (over) {
                wrapper.classList.remove('active');
                wrapper.classList.add('error');
                scanner.style.display = 'none';
                dlBtn.style.display = 'none';

                const overflow = used - MAX_BYTES;
                showPlaceholder(
                    '⚠️',
                    `内容超出二维码容量<br>
                     <span class="big-num">当前 ${used} 字符</span><br>
                     上限 ${MAX_BYTES} 字符（纠错等级 ${ECC_NAME}）<br>
                     超出 <b>${overflow}</b> 字符，请精简内容`,
                    true
                );
                return;
            }

            /* ---- 库加载失败 ---- */
            if (typeof QRCode === 'undefined') {
                wrapper.classList.remove('active');
                wrapper.classList.add('error');
                scanner.style.display = 'none';
                dlBtn.style.display = 'none';
                showPlaceholder('⚠️', '二维码库加载失败，请检查网络后刷新', true);
                return;
            }

            /* ---- 正常生成 ---- */
            try {
                new QRCode(container, {
                    text: content,
                    width: 220,
                    height: 220,
                    colorDark: fg,
                    colorLight: bg,
                    correctLevel: ECC_LEVEL
                });

                placeholder.style.display = 'none';
                placeholder.classList.remove('warn');
                wrapper.classList.remove('error');
                wrapper.classList.add('active');
                scanner.style.display = 'block';
                dlBtn.style.display = 'flex';
            } catch (err) {
                console.error("生成失败:", err);
                wrapper.classList.remove('active');
                wrapper.classList.add('error');
                scanner.style.display = 'none';
                dlBtn.style.display = 'none';

                showPlaceholder(
                    '⚠️',
                    `生成失败：内容超出容量<br>
                     <span class="big-num">当前 ${used} 字符</span><br>
                     上限 ${MAX_BYTES} 字符（纠错等级 ${ECC_NAME}）`,
                    true
                );
            }
        }

        /* ---------- 下载 ---------- */
        function downloadImage() {
            const img = container.querySelector('img');
            const canvas = container.querySelector('canvas');
            if (!img && !canvas) return;

            const link = document.createElement('a');
            link.download = 'qrcode_download.png';
            link.href = img ? img.src : canvas.toDataURL("image/png");
            link.click();
        }

        /* ---------- 清空 ---------- */
        function clearContent() {
            input.value = "";
            updateCounter();
            updateQR();
            input.focus();
        }

        /* ---------- 事件监听 ---------- */
        const debouncedUpdateQR = debounce(updateQR, 400);

        input.addEventListener('input', () => {
            updateCounter();      // 计数即时更新，不防抖
            debouncedUpdateQR();  // 二维码延迟生成
        });

        document.getElementById('fgColor').addEventListener('change', updateQR);
        document.getElementById('bgColor').addEventListener('change', updateQR);

        /* ---------- 初始化 ---------- */
        updateCounter();
    </script>
</body>

</html>
