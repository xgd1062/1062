<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>极简二维码生成器 Pro - 2026 版</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode/1.5.0/qrcode.js"></script>
    <!-- 
    上面的网络库不管用的话，换这个本地库
    <script src="07 qrcode.js"></script>
    -->


    <style>
        :root {
            --primary: #667eea;
            --secondary: #764ba2;
            --accent: #00f2fe;
            --danger: #e53e3e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            width: 100%;
            max-width: 480px;
            border-radius: 28px;
            padding: 35px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.2);
        }

        h1 {
            text-align: center;
            font-size: 24px;
            color: #1a202c;
            margin-bottom: 30px;
            letter-spacing: 1px;
        }

        h1 span {
            color: var(--primary);
        }

        .section-label {
            font-size: 13px;
            font-weight: 700;
            color: #a0aec0;
            text-transform: uppercase;
            margin-bottom: 8px;
            display: block;
        }

        textarea {
            width: 100%;
            height: 110px;
            padding: 15px;
            border: 2px solid #e2e8f0;
            border-radius: 16px;
            background: #f7fafc;
            font-size: 16px;
            resize: none;
            outline: none;
            transition: all 0.3s ease;
            margin-bottom: 8px;
        }

        textarea:focus {
            border-color: var(--primary);
            background: white;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.15);
        }

        textarea.over {
            border-color: #fc8181;
            background: #fff5f5;
        }

        .input-meta {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: #a0aec0;
            margin-bottom: 16px;
            transition: color 0.25s ease;
        }

        .input-meta.over {
            color: var(--danger);
            font-weight: 700;
        }

        .input-meta .hint {
            color: #cbd5e0;
            font-weight: 400;
        }

        .input-meta.over .hint {
            color: #feb2b2;
            font-weight: 400;
        }

        .config-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 25px;
        }

        .config-item {
            background: #f7fafc;
            padding: 10px 15px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        input[type="color"] {
            border: none;
            width: 30px;
            height: 30px;
            cursor: pointer;
            background: none;
        }

        .qr-display-area {
            position: relative;
            background: #edf2f7;
            border-radius: 20px;
            width: 100%;
            height: 280px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 2px dashed #cbd5e0;
        }

        .qr-display-area.active {
            background: white;
            border: 2px solid #edf2f7;
        }

        .qr-display-area.error {
            background: #fff5f5;
            border: 2px dashed #fc8181;
        }

        .scanner-line {
            display: none;
            position: absolute;
            width: 240px;
            height: 3px;
            background: linear-gradient(to right, transparent, var(--accent), transparent);
            box-shadow: 0 0 15px var(--accent);
            z-index: 10;
            animation: scan 2s linear infinite;
        }

        @keyframes scan {
            0% {
                top: 20px;
            }

            50% {
                top: 260px;
            }

            100% {
                top: 20px;
            }
        }

        .placeholder {
            text-align: center;
            color: #a0aec0;
            transition: 0.3s;
            padding: 0 24px;
        }

        .placeholder-icon {
            font-size: 48px;
            margin-bottom: 10px;
            display: block;
        }

        .placeholder p {
            font-size: 14px;
            line-height: 1.7;
        }

        .placeholder.warn {
            color: var(--danger);
        }

        .placeholder.warn .placeholder-icon {
            animation: shake 0.4s ease;
        }

        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-4px);
            }

            75% {
                transform: translateX(4px);
            }
        }

        .placeholder .big-num {
            font-size: 17px;
            font-weight: 700;
        }

        .placeholder code {
            background: #fff5f5;
            color: #c53030;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 12px;
            word-break: break-all;
        }

        .action-btns {
            margin-top: 20px;
            display: flex;
            gap: 12px;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border-radius: 12px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-download {
            background: var(--primary);
            color: white;
            display: none;
        }

        .btn-clear {
            background: #e2e8f0;
            color: #4a5568;
        }

        .btn:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        #qrcode img {
            display: block;
            border-radius: 8px;
        }
    </style>
</head>

<body>

    <div class="card">
        <h1>QR Code <span>Gen Pro</span></h1>

        <label class="section-label">内容 / 链接</label>
        <textarea id="inputField" placeholder="输入网址、文本或 Wi-Fi 信息..."></textarea>

        <div class="input-meta" id="inputMeta">
            <span>已用 <b id="charCount">0</b> / <b id="charLimit">1273</b> 字节</span>
            <span class="hint">（中文按 3 字节计）</span>
        </div>

        <div class="config-row">
            <div class="config-item">
                <span style="font-size: 13px;">前景色</span>
                <input type="color" id="fgColor" value="#000000">
            </div>
            <div class="config-item">
                <span style="font-size: 13px;">背景色</span>
                <input type="color" id="bgColor" value="#ffffff">
            </div>
        </div>

        <div id="wrapper" class="qr-display-area">
            <div class="scanner-line" id="scanner"></div>
            <div id="qrcode"></div>
            <div class="placeholder" id="placeholderUI">
                <span class="placeholder-icon">📷</span>
                <p>等待输入内容</p>
            </div>
        </div>

        <div class="action-btns">
            <button class="btn btn-clear" onclick="clearContent()">清空</button>
            <button class="btn btn-download" id="dlBtn" onclick="downloadImage()">保存图片</button>
        </div>
    </div>

    <script>
        /* =========================================================
         * 库检测：自动识别当前加载的是哪个 QRCode
         * ========================================================= */
        const libInfo = (function () {
            if (typeof QRCode === 'undefined') {
                return { ok: false, name: 'none', msg: 'QRCode 未定义，脚本未加载' };
            }
            // node-qrcode：QRCode 是对象，带 toDataURL 方法
            if (typeof QRCode.toDataURL === 'function') {
                return { ok: true, name: 'node-qrcode', api: 'toDataURL' };
            }
            // qrcodejs：QRCode 是构造函数，但会误算 UTF-8 长度
            if (typeof QRCode === 'function') {
                return {
                    ok: false,
                    name: 'qrcodejs',
                    msg: '检测到 qrcodejs（有 UTF-8 容量计算 bug），请换成 node-qrcode'
                };
            }
            return {
                ok: false,
                name: 'unknown',
                msg: 'QRCode 类型异常：' + typeof QRCode
            };
        })();

        console.log('[QR] 库检测结果：', libInfo);

        /* ---------- DOM 引用 ---------- */
        const input = document.getElementById('inputField');
        const container = document.getElementById('qrcode');
        const wrapper = document.getElementById('wrapper');
        const placeholder = document.getElementById('placeholderUI');
        const scanner = document.getElementById('scanner');
        const dlBtn = document.getElementById('dlBtn');
        const inputMeta = document.getElementById('inputMeta');
        const charCountEl = document.getElementById('charCount');
        const charLimitEl = document.getElementById('charLimit');

        /* ---------- 纠错等级与容量 ---------- */
        const ECC_LEVEL = 'H';
        const MAX_BYTES = 1273;
        charLimitEl.textContent = MAX_BYTES;

        /* ---------- UTF-8 字节长度 ---------- */
        function getByteLength(str) {
            let bytes = 0;
            for (const ch of str) {
                const code = ch.codePointAt(0);
                if (code <= 0x7F) bytes += 1;
                else if (code <= 0x7FF) bytes += 2;
                else if (code <= 0xFFFF) bytes += 3;
                else bytes += 4;
            }
            return bytes;
        }

        function debounce(fn, delay) {
            let timer;
            return function () {
                clearTimeout(timer);
                timer = setTimeout(() => fn.apply(this, arguments), delay);
            };
        }

        function showPlaceholder(icon, html, isWarn = false) {
            placeholder.style.display = 'block';
            placeholder.classList.toggle('warn', isWarn);
            placeholder.innerHTML =
                `<span class="placeholder-icon">${icon}</span><p>${html}</p>`;
        }

        /* ---------- 字符计数 ---------- */
        function updateCounter() {
            const used = getByteLength(input.value.trim());
            charCountEl.textContent = used;
            charLimitEl.textContent = MAX_BYTES;
            const over = used > MAX_BYTES;
            inputMeta.classList.toggle('over', over);
            input.classList.toggle('over', over);
            return { used, over };
        }

        /* ---------- 请求令牌：避免快速输入的竞态 ---------- */
        let genToken = 0;

        /* ---------- 统一的生成入口（支持两种库） ---------- */
        function generateQR(text, fg, bg) {
            return new Promise((resolve, reject) => {
                /* --- node-qrcode：优先 --- */
                if (typeof QRCode.toDataURL === 'function') {
                    QRCode.toDataURL(text, {
                        errorCorrectionLevel: ECC_LEVEL,
                        width: 220,
                        margin: 1,
                        color: { dark: fg, light: bg }
                    }).then(resolve).catch(reject);
                    return;
                }
                /* --- qrcodejs：兜底（虽然容量有 bug，但短内容可用） --- */
                if (typeof QRCode === 'function') {
                    try {
                        const tmp = document.createElement('div');
                        new QRCode(tmp, {
                            text: text,
                            width: 220,
                            height: 220,
                            colorDark: fg,
                            colorLight: bg,
                            correctLevel: 2
                        });
                        setTimeout(() => {
                            const img = tmp.querySelector('img');
                            const canvas = tmp.querySelector('canvas');
                            if (img && img.src) resolve(img.src);
                            else if (canvas) resolve(canvas.toDataURL('image/png'));
                            else reject(new Error('qrcodejs 未生成图像'));
                        }, 50);
                    } catch (e) {
                        reject(e);
                    }
                    return;
                }
                reject(new Error('没有可用的 QRCode 库'));
            });
        }

        /* ---------- 主更新逻辑 ---------- */
        async function updateQR() {
            const content = input.value.trim();
            const fg = document.getElementById('fgColor').value;
            const bg = document.getElementById('bgColor').value;

            const { used, over } = updateCounter();
            container.innerHTML = "";
            const myToken = ++genToken;

            /* ---- 空状态 ---- */
            if (!content) {
                wrapper.classList.remove('active', 'error');
                scanner.style.display = 'none';
                dlBtn.style.display = 'none';
                showPlaceholder('📷', '等待输入内容');
                return;
            }

            /* ---- 超限状态 ---- */
            if (over) {
                wrapper.classList.remove('active');
                wrapper.classList.add('error');
                scanner.style.display = 'none';
                dlBtn.style.display = 'none';

                const overflow = used - MAX_BYTES;
                showPlaceholder('⚠️',
                    `内容超出二维码容量<br>
                     <span class="big-num">当前 ${used} 字节</span><br>
                     上限 ${MAX_BYTES} 字节（纠错等级 ${ECC_LEVEL}）<br>
                     超出 <b>${overflow}</b> 字节，请精简内容`, true);
                return;
            }

            /* ---- 库检测失败：显示具体原因 ---- */
            if (!libInfo.ok) {
                wrapper.classList.remove('active');
                wrapper.classList.add('error');
                scanner.style.display = 'none';
                dlBtn.style.display = 'none';

                showPlaceholder('⚠️',
                    `二维码库不可用<br>
                     检测到：<code>${libInfo.name}</code><br>
                     ${libInfo.msg || ''}<br>
                     <span style="font-size:12px;color:#718096;">
                       请下载 node-qrcode 版的 qrcode.min.js
                     </span>`, true);
                return;
            }

            /* ---- 正常生成 ---- */
            try {
                const dataUrl = await generateQR(content, fg, bg);
                if (myToken !== genToken) return;

                const img = document.createElement('img');
                img.src = dataUrl;
                img.alt = 'QR Code';
                container.appendChild(img);

                placeholder.style.display = 'none';
                placeholder.classList.remove('warn');
                wrapper.classList.remove('error');
                wrapper.classList.add('active');
                scanner.style.display = 'block';
                dlBtn.style.display = 'flex';
            } catch (err) {
                if (myToken !== genToken) return;

                console.error('生成失败:', err);
                wrapper.classList.remove('active');
                wrapper.classList.add('error');
                scanner.style.display = 'none';
                dlBtn.style.display = 'none';

                const msg = (err && err.message) ? err.message : String(err);
                showPlaceholder('⚠️',
                    `生成失败：<br>
                     <code>${msg}</code><br>
                     <span class="big-num">当前 ${used} 字节</span><br>
                     上限 ${MAX_BYTES} 字节（纠错等级 ${ECC_LEVEL}）`, true);
            }
        }

        /* ---------- 下载 ---------- */
        function downloadImage() {
            const img = container.querySelector('img');
            if (!img) return;
            const link = document.createElement('a');
            link.download = 'qrcode_download.png';
            link.href = img.src;
            link.click();
        }

        /* ---------- 清空 ---------- */
        function clearContent() {
            input.value = "";
            updateCounter();
            updateQR();
            input.focus();
        }

        /* ---------- 事件绑定 ---------- */
        const debouncedUpdateQR = debounce(updateQR, 300);

        input.addEventListener('input', () => {
            updateCounter();
            debouncedUpdateQR();
        });

        document.getElementById('fgColor').addEventListener('change', updateQR);
        document.getElementById('bgColor').addEventListener('change', updateQR);

        /* ---------- 初始化：如果库有问题，直接显示出来 ---------- */
        updateCounter();

        if (!libInfo.ok) {
            wrapper.classList.add('error');
            showPlaceholder('⚠️',
                `二维码库不可用<br>
                 检测到：<code>${libInfo.name}</code><br>
                 ${libInfo.msg || ''}`, true);
        }
    </script>
</body>

</html>
