<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>诗意工具箱 - 精致微缩版</title>
    <style>
        :root {
            --primary: #a78bfa;
            --bg-dark: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.65);
            --border: rgba(255, 255, 255, 0.12);
            --text-main: #f1f5f9;
            --text-dim: #94a3b8;
            --star-color: #fbbf24;
            --empty-bg: rgba(255, 255, 255, 0.02);
            --danger: #f43f5e;
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif;
            background: radial-gradient(circle at top right, #1e293b, #0f172a);
            color: var(--text-main);
            min-height: 100vh;
            padding: 20px 15px calc(90px + var(--safe-bottom));
            overflow-x: hidden;
        }

        /* 提示悬浮窗（优化动画与触控穿透） */
        .toast {
            position: fixed;
            top: 15px;
            left: 50%;
            transform: translateX(-50%) translateY(-30px) scale(0.9);
            background: rgba(30, 41, 59, 0.92);
            border: 1px solid var(--primary);
            color: var(--text-main);
            padding: 10px 20px;
            border-radius: 25px;
            font-size: 0.85rem;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            z-index: 3000;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: flex;
            align-items: center;
            gap: 6px;
            max-width: 90vw;
            white-space: nowrap;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0) scale(1);
        }

        .toast.success {
            border-color: #10b981;
        }

        .toast.error {
            border-color: #f43f5e;
        }

        .toast.info {
            border-color: var(--primary);
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        .poem-title {
            font-size: 1.6rem;
            font-weight: 800;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #818cf8, #c084fc);
            -webkit-background-clip: text;
            color: transparent;
            letter-spacing: 0.5px;
        }

        .controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        #searchInput {
            width: 100%;
            max-width: 420px;
            height: 42px;
            padding: 0 20px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--border);
            border-radius: 21px;
            color: white;
            outline: none;
            backdrop-filter: blur(8px);
            font-size: 0.9rem;
            transition: border-color 0.2s ease;
        }

        #searchInput:focus {
            border-color: var(--primary);
        }

        .category-bar {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 100%;
        }

        .cat-btn {
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.04);
            color: var(--text-dim);
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 0.8rem;
            min-height: 32px;
            display: inline-flex;
            align-items: center;
        }

        .cat-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
            font-weight: 600;
        }

        .top-row {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
        }

        .top-column {
            flex: 1;
            background: var(--empty-bg);
            padding: 12px;
            border-radius: 16px;
            border: 1px dashed rgba(255, 255, 255, 0.08);
            min-height: 90px;
        }

        .top-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .section-label {
            margin-bottom: 10px;
            font-size: 0.85rem;
            color: var(--primary);
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .tool-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
            gap: 12px;
        }

        .tool-card {
            background: var(--card-bg);
            border-radius: 14px;
            border: 1px solid var(--border);
            padding: 12px;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            height: 92px;
            overflow: hidden;
        }

        .tool-card:active:not(.editing-mode) {
            transform: scale(0.98);
        }

        @media (hover: hover) {
            .tool-card:hover:not(.editing-mode) {
                transform: translateY(-3px);
                border-color: var(--primary);
                box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
            }
        }

        .editing-mode {
            border: 1px dashed var(--primary);
            cursor: pointer;
        }

        .tool-card h3 {
            color: #fff;
            font-size: 0.9rem;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            padding-right: 24px;
            font-weight: 600;
        }

        .tool-card p {
            color: var(--text-dim);
            font-size: 0.75rem;
            line-height: 1.35;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* 放大星号点击响应区 */
        .star-btn {
            position: absolute;
            top: 0;
            right: 0;
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            cursor: pointer;
            color: #4b5563;
            z-index: 5;
        }

        .star-btn.active {
            color: var(--star-color);
        }

        .card-tag {
            position: absolute;
            bottom: 0;
            right: 0;
            padding: 2px 8px;
            font-size: 0.6rem;
            background: rgba(167, 139, 250, 0.15);
            color: var(--primary);
            border-top-left-radius: 8px;
        }

        /* 模态框遮罩层 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(5px);
            z-index: 1999;
        }

        #editorModal,
        #configModal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #1e293b;
            border: 1px solid var(--border);
            padding: 20px;
            border-radius: 16px;
            z-index: 2000;
            width: 90%;
            max-width: 480px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
        }

        #jsonTextArea {
            width: 100%;
            height: 260px;
            background: #0f172a;
            color: #10b981;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px;
            font-family: monospace;
            font-size: 0.85rem;
            resize: none;
            outline: none;
        }

        /* 底部控制栏优化 */
        .admin-bar {
            position: fixed;
            bottom: calc(15px + var(--safe-bottom));
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            background: rgba(15, 23, 42, 0.88);
            padding: 8px 16px;
            border-radius: 30px;
            border: 1px solid var(--border);
            z-index: 1000;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
        }

        .btn-main {
            height: 36px;
            padding: 0 16px;
            border-radius: 18px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.8rem;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            white-space: nowrap;
        }

        .btn-main:active {
            transform: scale(0.95);
        }

        .btn-edit {
            background: var(--primary);
            color: white;
        }

        .btn-gh {
            background: #334155;
            color: white;
        }

        .btn-add {
            background: #3b82f6;
            color: white;
            display: none;
        }

        .hidden {
            display: none !important;
        }

        /* 移动端深度适配 (< 600px) */
        @media (max-width: 600px) {
            body {
                padding: 15px 12px calc(85px + var(--safe-bottom));
            }

            .poem-title {
                font-size: 1.35rem;
            }

            .top-row {
                flex-direction: column;
                gap: 12px;
            }

            .tool-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }

            .tool-card {
                height: 86px;
                padding: 10px;
            }

            .tool-card h3 {
                font-size: 0.85rem;
            }

            .tool-card p {
                font-size: 0.7rem;
            }

            .admin-bar {
                width: calc(100% - 24px);
                max-width: 400px;
                justify-content: space-between;
            }

            .btn-main {
                flex: 1;
                padding: 0 10px;
            }

            #editorModal,
            #configModal {
                width: 94%;
                padding: 16px;
            }
        }
    </style>
</head>

<body>

    <!-- 悬浮提示框 -->
    <div id="toast" class="toast"></div>

    <div class="container">
        <header>
            <h1 class="poem-title">欲善其事，必先利其器</h1>
            <div class="controls">
                <input type="text" id="searchInput" placeholder="搜索工具或描述...">
                <div class="category-bar" id="categoryBar"></div>
            </div>
        </header>

        <div id="topSection" class="top-row">
            <div class="top-column">
                <div class="section-label">⭐ 常用</div>
                <div id="favGrid" class="top-grid"></div>
            </div>
            <div class="top-column" id="historySection">
                <div class="section-label">🕒 历史</div>
                <div id="hisGrid" class="top-grid"></div>
            </div>
        </div>

        <div class="section-label">🚀 库 <span id="syncStatus"
                style="font-size:0.65rem; margin-left:8px; opacity:0.5; font-weight:normal;"></span></div>
        <div id="toolGrid" class="tool-grid"></div>
    </div>

    <!-- JSON 编辑弹窗 -->
    <div id="editorModal" class="hidden">
        <h4 style="margin-bottom:12px; color:var(--primary); font-size:0.95rem;">数据对象编辑器 (JSON)</h4>
        <textarea id="jsonTextArea" spellcheck="false"></textarea>
        <div style="display:flex; gap:8px; margin-top:12px;">
            <button class="btn-main" style="background:#10b981; flex:1;" onclick="applyJsonChange()">保存</button>
            <button class="btn-main" style="background:#f43f5e; width:65px;" onclick="deleteCurrent()">删除</button>
            <button class="btn-main" style="background:#4b5563; width:65px;" onclick="closeEditor()">取消</button>
        </div>
    </div>

    <!-- 配置弹窗 -->
    <div id="configModal" class="hidden">
        <h4 style="margin-bottom:12px; font-size:0.95rem; color:var(--primary);">GitHub 同步配置</h4>
        <input id="ghToken" type="password" placeholder="GitHub Personal Access Token"
            style="width:100%; height:38px; margin-bottom:10px; background:rgba(0,0,0,0.3); border:1px solid var(--border); border-radius:8px; color:white; padding:0 10px; font-size:0.85rem; outline:none;">
        <input id="ghRepo" placeholder="仓库路径 (例: xgd1062/v)"
            style="width:100%; height:38px; margin-bottom:15px; background:rgba(0,0,0,0.3); border:1px solid var(--border); border-radius:8px; color:white; padding:0 10px; font-size:0.85rem; outline:none;">
        <div style="display:flex; gap:8px;">
            <button class="btn-main" style="background:var(--primary); flex:1;" onclick="saveConfig()">保存配置</button>
            <button class="btn-main" style="background:#4b5563; width:70px;" onclick="toggleConfig()">取消</button>
        </div>
    </div>

    <!-- 底部悬浮控制栏 -->
    <div class="admin-bar">
        <button class="btn-main btn-gh" onclick="toggleConfig()">⚙️ 配置</button>
        <button id="editBtn" class="btn-main btn-edit" onclick="toggleEditMode()">🛠️ 管理</button>
        <button id="addBtn" class="btn-main btn-add" onclick="addNewTool()">+ 新增</button>
    </div>

    <script>
        let allTools = [];
        let isEditing = false;
        let currentCat = '全部';
        let editingId = null;
        let syncTimer = null;
        const STORAGE_KEY = 'poet_tools_v12';
        const FILE_NAME = 'tools.json';

        document.addEventListener('DOMContentLoaded', async () => {
            const local = localStorage.getItem(STORAGE_KEY);
            if (local) { allTools = JSON.parse(local); renderAll(); initCategories(); }
            await fetchFromGitHub();
            renderAll();
            initCategories();
            document.getElementById('searchInput').oninput = () => renderAll();

            if (localStorage.getItem('gh_token')) document.getElementById('ghToken').value = localStorage.getItem('gh_token');
            if (localStorage.getItem('gh_repo')) document.getElementById('ghRepo').value = localStorage.getItem('gh_repo');
        });

        function showToast(msg, type = 'info') {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.className = `toast show ${type}`;
            clearTimeout(toast.timer);
            toast.timer = setTimeout(() => {
                toast.classList.remove('show');
            }, 2200);
        }

        async function fetchFromGitHub() {
            const token = localStorage.getItem('gh_token'), repo = localStorage.getItem('gh_repo');
            if (!token || !repo) return;
            document.getElementById('syncStatus').innerText = "正在同步...";
            try {
                const res = await fetch(`https://api.github.com/repos/${repo}/contents/${FILE_NAME}?t=${Date.now()}`, {
                    headers: { 'Authorization': `token ${token}` }
                });
                if (res.ok) {
                    const data = await res.json();
                    allTools = JSON.parse(decodeURIComponent(escape(atob(data.content))));
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(allTools));
                    document.getElementById('syncStatus').innerText = "云端就绪";
                }
            } catch (e) { document.getElementById('syncStatus').innerText = "本地模式"; }
        }

        function autoSave() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(allTools));
            renderAll();
            clearTimeout(syncTimer);
            syncTimer = setTimeout(syncToGitHub, 800);
        }

        async function syncToGitHub() {
            const token = localStorage.getItem('gh_token'), repo = localStorage.getItem('gh_repo');
            if (!token || !repo) {
                showToast("已保存至本地", "info");
                return;
            }

            showToast("⏳ 正在自动同步...", "info");
            document.getElementById('syncStatus').innerText = "正在同步...";

            try {
                let sha = "";
                const getRes = await fetch(`https://api.github.com/repos/${repo}/contents/${FILE_NAME}`, {
                    headers: { 'Authorization': `token ${token}` }
                });
                if (getRes.ok) sha = (await getRes.json()).sha;

                const content = btoa(unescape(encodeURIComponent(JSON.stringify(allTools, null, 2))));
                const putRes = await fetch(`https://api.github.com/repos/${repo}/contents/${FILE_NAME}`, {
                    method: 'PUT',
                    headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: "Auto Sync Tools", content, sha })
                });

                if (putRes.ok) {
                    showToast("✨ 已自动同步至云端", "success");
                    document.getElementById('syncStatus').innerText = "云端就绪";
                } else {
                    showToast("❌ 同步失败，请检查配置", "error");
                    document.getElementById('syncStatus').innerText = "同步失败";
                }
            } catch (e) {
                showToast("❌ 网络异常，同步失败", "error");
                document.getElementById('syncStatus').innerText = "网络异常";
            }
        }

        function renderGrid(containerId, data) {
            const grid = document.getElementById(containerId);
            grid.innerHTML = data.length ? '' : '<div class="empty-hint" style="grid-column:1/-1; text-align:center; font-size:0.75rem; opacity:0.3; padding:15px 0;">无数据</div>';

            data.forEach((tool) => {
                const card = document.createElement(isEditing ? 'div' : 'a');
                card.className = `tool-card ${isEditing ? 'editing-mode' : ''}`;
                if (!isEditing) {
                    card.href = tool.link;
                    if (tool.link.startsWith('http')) card.target = "_blank";
                    card.onclick = () => recordHistory(tool.id);
                } else {
                    card.onclick = () => openEditor(tool.id);
                }

                card.innerHTML = `
                    ${!isEditing ? `<div class="star-btn ${tool.fav ? 'active' : ''}" onclick="event.preventDefault();toggleFav(${tool.id})">★</div>` : ''}
                    <h3 title="${tool.title}">${tool.icon || '🛠️'} ${tool.title}</h3>
                    <p>${tool.desc}</p>
                    <div class="card-tag">${tool.category}</div>
                `;
                grid.appendChild(card);
            });
        }

        function openEditor(id) {
            editingId = id;
            const tool = allTools.find(t => t.id === id);
            document.getElementById('jsonTextArea').value = JSON.stringify(tool, null, 4);
            document.getElementById('editorModal').classList.remove('hidden');
        }

        function closeEditor() {
            document.getElementById('editorModal').classList.add('hidden');
            editingId = null;
        }

        function applyJsonChange() {
            try {
                const updated = JSON.parse(document.getElementById('jsonTextArea').value);
                const idx = allTools.findIndex(t => t.id === editingId);
                allTools[idx] = updated;
                closeEditor();
                autoSave();
            } catch (e) { showToast("JSON 格式错误，请检查", "error"); }
        }

        function deleteCurrent() {
            if (confirm("确定删除此项？")) {
                allTools = allTools.filter(t => t.id !== editingId);
                closeEditor();
                autoSave();
            }
        }

        function addNewTool() {
            const newTool = {
                id: Date.now(),
                title: "新工具",
                icon: "🚀",
                link: "#",
                category: currentCat === '全部' ? "默认" : currentCat,
                desc: "请输入描述",
                fav: false
            };
            allTools.unshift(newTool);
            openEditor(newTool.id);
            autoSave();
        }

        function toggleEditMode() {
            isEditing = !isEditing;
            document.getElementById('editBtn').innerText = isEditing ? '✅ 退出' : '🛠️ 管理';
            document.getElementById('addBtn').style.display = isEditing ? 'flex' : 'none';
            renderAll();
        }

        async function toggleFav(id) {
            const t = allTools.find(x => x.id === id);
            if (t) {
                t.fav = !t.fav;
                autoSave();
            }
        }

        function recordHistory(id) {
            let his = JSON.parse(localStorage.getItem('tool_his_v11') || '[]');
            his = [id, ...his.filter(x => x !== id)].slice(0, 2);
            localStorage.setItem('tool_his_v11', JSON.stringify(his));
        }

        function initCategories() {
            const cats = [...new Set(allTools.map(t => t.category))].filter(Boolean);
            document.getElementById('categoryBar').innerHTML = ['全部', ...cats].map(c =>
                `<button class="cat-btn ${c === currentCat ? 'active' : ''}" onclick="filterCat('${c}')">${c}</button>`
            ).join('');
        }

        function filterCat(cat) { currentCat = cat; renderAll(); initCategories(); }

        function renderAll() {
            const filter = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allTools.filter(t => (currentCat === '全部' || t.category === currentCat) && (t.title.toLowerCase().includes(filter) || t.desc.toLowerCase().includes(filter)));
            renderGrid('toolGrid', filtered);

            const favs = allTools.filter(t => t.fav).slice(0, 2);
            const hisIds = JSON.parse(localStorage.getItem('tool_his_v11') || '[]');
            const hisTools = hisIds.map(id => allTools.find(t => t.id === id)).filter(Boolean).slice(0, 2);
            renderGrid('favGrid', favs);
            renderGrid('hisGrid', hisTools);

            document.getElementById('topSection').style.display = (isEditing || filter) ? 'none' : 'flex';
        }

        function toggleConfig() { document.getElementById('configModal').classList.toggle('hidden'); }
        function saveConfig() {
            localStorage.setItem('gh_token', document.getElementById('ghToken').value.trim());
            localStorage.setItem('gh_repo', document.getElementById('ghRepo').value.trim());
            toggleConfig();
            showToast("配置已保存", "success");
            fetchFromGitHub();
        }
    </script>
</body>

</html>
